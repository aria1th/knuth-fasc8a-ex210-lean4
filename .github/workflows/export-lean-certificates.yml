name: Export Lean certificate data

on:
  push:
    branches: ["pr3-closed-counterexample"]
    paths:
      - "data/certs/visible76.poly"
      - "data/certs/Trel_plus_eigen50.vec"
      - "data/blocks/Tall_finish.vec"
      - "data/blocks/Trel_plus.kmc"
      - "scripts/export_lean_certificate_hex.py"
      - ".github/workflows/export-lean-certificates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr3-closed-counterexample
      - name: Export canonical certificate data and generated Lean modules
        run: python3 scripts/export_lean_certificate_hex.py
      - name: Commit generated artifacts when changed
        shell: bash
        run: |
          generated=(data/lean KnuthFasc8AEx210/Closed/Generated)
          if [ -z "$(git status --porcelain -- "${generated[@]}")" ]; then
            echo "Generated certificate artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${generated[@]}"
          git commit -m "pr3: regenerate Lean row-block certificates"
          git push origin HEAD:pr3-closed-counterexample
