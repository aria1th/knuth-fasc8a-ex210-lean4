name: Lean 4

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean and the mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-mathlib-cache: true
      - name: Build
        shell: bash
        run: |
          set +e
          lake build > lean-build.log 2>&1
          status=$?
          tail -n 160 lean-build.log
          exit "$status"
      - name: Post failed-build diagnostics to the pull request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- lean-ci-diagnostics -->'
            echo '### Lean build diagnostics'
            echo '```text'
            tail -n 160 lean-build.log
            echo '```'
          } > lean-diagnostics.md
          gh pr comment "$PR_NUMBER" --body-file lean-diagnostics.md
      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -RInE --include='*.lean' '\b(sorry|admit)\b' KnuthFasc8AEx210.lean KnuthFasc8AEx210; then
            echo "Lean proof placeholder found"
            exit 1
          fi
